line-length = 120
target-version = "py315"

[lint]
# Rule list
# By default, Ruff enables the Flake8 E and F rules
# Pyflakes - F, pycodestyle - E, W
# flake8-builtins - A
# flake8-quotes - Q
# flake8-comprehensions - C4
# flake8-datetimez - DTZ
# Pylint - PLC, PLE, PLW
# isort - I
# select = ['E', 'F', 'Q', 'W', 'A', 'C4', 'DTZ', 'PLC', 'PLE', 'PLW', 'I']
select = ["ALL"]

[lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is the core of pytest
    "PLR2004",  # expected values written out in tests
    "S105",     # fake passwords and keys in fixtures
]

[lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"
