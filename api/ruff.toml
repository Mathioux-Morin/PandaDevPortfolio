line-length = 120
target-version = "py315"

[lint]
# Liste des règles
# Par défaut, Ruff active les règles Flake8 E et F
# Pyflakes - F, pycodestyle - E, W
# flake8-builtins - A
# flake8-quotes - Q
# flake8-comprehensions- C4
# flake8-datetimeZ
# Pylint - PLC, PLE, PLW
# isort - I
# select = ['E', 'F', 'Q', 'W', 'A', 'C4', 'DTZ', 'PLC', 'PLE', 'PLW', 'I']
select = ["ALL"]

[lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert est la base de pytest
    "PLR2004",  # valeurs attendues écrites en clair dans les tests
    "S105",     # mots de passe et clés factices des fixtures
]

[lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"