name: pandadev-portfolio

services:
  bdd:
    build: .
    image: pandadev-portfolio-bdd:18.6
    env_file: .env
    ports:
      # Accessible uniquement depuis la machine hôte.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 : le volume se monte sur /var/lib/postgresql (et non plus .../data).
      - bdd-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  bdd-data:
